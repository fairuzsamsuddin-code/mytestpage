<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Van Hi Ace - Pengurusan Jenazah</title>
    
    <!-- Include html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #0b1a30;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Main Container */
        #document-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Header Styles - Fixed to wrap correctly on smaller screens */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .title {
            flex: 1 1 300px;
        }

        .title h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            color: var(--primary-color);
            text-transform: uppercase;
            line-height: 1.1;
        }
        
        .title h2 {
            margin: 0;
            font-size: 18px;
            color: #555;
        }

        .meta-info {
            flex: 1 1 300px;
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .input-group label {
            width: 100px;
            font-weight: bold;
            font-size: 13px;
        }

        .input-group input, .input-group select {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Interactive Van Display - Fixed aspect ratio removes dead space */
        .van-display {
            position: relative;
            width: 100%;
            /* 1.45 aspect ratio closely matches the 4-view image dimensions */
            aspect-ratio: 1.45; 
            background-color: #ffffff;
            border-radius: 8px;
            margin-bottom: 20px;
            background-image: url('van_view.jpeg');
            background-size: 100% 100%; /* Forces image to fit container perfectly */
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid var(--primary-color);
        }

        /* Indicators on the Van */
        .indicator {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .indicator.ok {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .indicator.not-ok {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Checklist Table Styles */
        .checklist-container {
            width: 100%;
            border-collapse: collapse;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item-number {
            background-color: var(--primary-color);
            color: white;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .item-label {
            flex: 1 1 200px;
            font-size: 15px;
            font-weight: 500;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Custom Check/Cross Buttons */
        .radio-btn {
            cursor: pointer;
            display: inline-block;
        }

        .radio-btn input {
            display: none; /* Hide default radio button */
        }

        .radio-btn span {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-size: 18px;
            background-color: white;
            transition: all 0.2s;
        }

        .radio-btn input[value="ok"]:checked + span {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
        }

        .radio-btn input[value="not-ok"]:checked + span {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            color: white;
        }

        .radio-btn span:hover {
            background-color: #f0f0f0;
        }

        .remark-input {
            display: none;
            padding: 8px;
            border: 1px solid var(--danger-color);
            border-radius: 4px;
            width: 200px;
            background-color: #fff8f8;
            font-size: 13px;
        }

        /* Controls */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #1a365d;
        }

        /* Hide elements when exporting to PDF */
        .html2pdf__container {
            padding: 0 !important;
        }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;" id="no-print-area">
        <button class="btn" onclick="exportPDF()">🖨️ Export to PDF</button>
    </div>

    <!-- Export Container -->
    <div id="document-container">
        
        <div class="header">
            <div class="title">
                <h1>CHECKLIST VAN HI ACE</h1>
                <h2>Perkhidmatan Van Jenazah</h2>
            </div>
            <div class="meta-info">
                <div class="input-group">
                    <label>Perjalanan:</label>
                    <select id="trip-type">
                        <option value="PERGI">PERGI (Departure)</option>
                        <option value="BALIK">BALIK (Return)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nama Driver:</label>
                    <input type="text" id="driver-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Nama Ko Pilot:</label>
                    <input type="text" id="copilot-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Tarikh / Masa:</label>
                    <input type="datetime-local" id="datetime">
                </div>
            </div>
        </div>

        <!-- Interactive Van Area -->
        <div class="van-display" id="van-display">
            <!-- Indicators will be injected here by JS -->
        </div>

        <div style="text-align: center; font-weight: bold; margin-bottom: 15px; color: #555; padding-top: 10px;">
            --- CEK BODY KELILING SEBELUM KELUAR DAN BALIK ---
        </div>

        <!-- Checklist Area -->
        <div class="checklist-container" id="checklist-container">
            <!-- Checklist items will be injected here by JS -->
        </div>

        <div style="margin-top: 25px; border: 2px solid var(--primary-color); border-radius: 8px; padding: 15px;">
            <h3 style="margin-top: 0; margin-bottom: 10px; color: var(--primary-color); font-size: 16px;">GENERAL REMARK :</h3>
            <textarea style="width: 100%; min-height: 60px; border: none; resize: none; font-family: inherit; font-size: 14px;" placeholder="Tulis sebarang nota tambahan di sini..."></textarea>
        </div>

    </div>

    <script>
        // Recalibrated Data specifically for a stretched 100%x100% container mapping of van_view.jpeg
        const checklistData = [
            // 1. Bottom-Right image (Left Side View) - Center body
            { id: 1, label: "Cek body keliling sebelum keluar dan balik", top: "75%", left: "75%" },
            
            // 2. Bottom-Right image (Left Side View) - Front Tire
            { id: 2, label: "Cek 4pcs Tayar (angin 220psi)", top: "88%", left: "63%" }, 
            
            // 3. Top-Left image (Front View) - Grille area
            { id: 3, label: "Cek Air Radiator", top: "25%", left: "25%" },
            
            // 4. Top-Left image (Front View) - Left under hood
            { id: 4, label: "Minyak Engine", top: "35%", left: "18%" },
            
            // 5. Top-Left image (Front View) - Right under hood
            { id: 5, label: "Minyak brake", top: "35%", left: "32%" },
            
            // 6. Top-Left image (Front View) - Center under hood
            { id: 6, label: "Minyak power steering", top: "38%", left: "25%" },
            
            // 7. Bottom-Left image (Rear View) - Bottom undercarriage
            { id: 7, label: "Angin tayar spare + toolset", top: "90%", left: "25%" },
            
            // 8. Top-Right image (Right Side View) - Top Roof
            { id: 8, label: "Car wash (selepas selesai urusan)", top: "8%", left: "75%" }
        ];

        const vanDisplay = document.getElementById('van-display');
        const checklistContainer = document.getElementById('checklist-container');

        // Initialize App
        function initApp() {
            checklistData.forEach(item => {
                // 1. Create Indicators on the Van
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.id = `indicator-${item.id}`;
                indicator.style.top = item.top;
                indicator.style.left = item.left;
                indicator.innerText = item.id; 
                vanDisplay.appendChild(indicator);

                // 2. Create Checklist Rows with Checkmark/X icons
                const row = document.createElement('div');
                row.className = 'checklist-item';
                
                row.innerHTML = `
                    <div class="item-number">${item.id}</div>
                    <div class="item-label">${item.label}</div>
                    <div class="item-actions">
                        <label class="radio-btn">
                            <input type="radio" name="item_${item.id}" value="ok" onchange="handleSelection(${item.id}, 'ok')">
                            <span style="color: #ccc;">✔</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="item_${item.id}" value="not-ok" onchange="handleSelection(${item.id}, 'not-ok')">
                            <span style="color: #ccc;">✖</span>
                        </label>
                        <input type="text" class="remark-input" id="remark-${item.id}" placeholder="Nyatakan isu / Remark...">
                    </div>
                `;
                checklistContainer.appendChild(row);
            });
        }

        // Handle Radio Button Selection
        function handleSelection(id, status) {
            const indicator = document.getElementById(`indicator-${id}`);
            const remarkInput = document.getElementById(`remark-${id}`);

            // Reset classes
            indicator.classList.remove('ok', 'not-ok');

            if (status === 'ok') {
                indicator.classList.add('ok');
                indicator.innerHTML = '✔';
                remarkInput.style.display = 'none';
                remarkInput.value = ''; // Clear remark if changed back to OK
            } else if (status === 'not-ok') {
                indicator.classList.add('not-ok');
                indicator.innerHTML = '✖';
                remarkInput.style.display = 'block';
                remarkInput.focus(); // Prompt driver to type issue
            }
        }

        // PDF Export Function using html2pdf.js
        function exportPDF() {
            const element = document.getElementById('document-container');
            const driverName = document.getElementById('driver-name').value || 'Unknown';
            const tripType = document.getElementById('trip-type').value;
            
            // Generate filename based on driver and trip type
            const fileName = `Checklist_Van_${tripType}_${driverName.replace(/\s+/g, '_')}.pdf`;

            const opt = {
                margin:       0.5,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // Run initialization on load
        window.onload = initApp;
    </script>
</body>
</html>

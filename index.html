<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Van Hi Ace 3D - Pengurusan Jenazah</title>
    
    <!-- Include html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Include Google's model-viewer for 3D integration -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --primary-color: #0b1a30;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Main Container */
        #document-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .title h1 {
            margin: 0;
            font-size: 32px;
            color: var(--primary-color);
            text-transform: uppercase;
        }
        
        .title h2 {
            margin: 0;
            font-size: 20px;
            color: #555;
        }

        .meta-info {
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .input-group label {
            width: 100px;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input, .input-group select {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 3D Viewer Styles */
        model-viewer {
            width: 100%;
            height: 400px;
            background-color: #e9ecef;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 2px solid var(--primary-color);
            --poster-color: #e9ecef;
        }

        /* 3D Hotspot Indicators */
        .indicator {
            display: block;
            width: 30px;
            height: 30px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 50%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }

        .indicator.ok {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .indicator.not-ok {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Checklist Table Styles */
        .checklist-container {
            width: 100%;
            border-collapse: collapse;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .item-number {
            background-color: var(--primary-color);
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 15px;
        }

        .item-label {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
        }

        .item-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .radio-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .remark-input {
            display: none;
            margin-left: 15px;
            padding: 8px;
            border: 1px solid var(--danger-color);
            border-radius: 4px;
            width: 250px;
            background-color: #fff8f8;
        }

        /* Controls */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #1a365d;
        }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;" id="no-print-area">
        <button class="btn" onclick="exportPDF()">🖨️ Export to PDF</button>
        <p style="font-size: 12px; color: #666; margin-top: 5px;">*You can click and drag the 3D model to rotate it.</p>
    </div>

    <!-- Export Container -->
    <div id="document-container">
        
        <div class="header">
            <div class="title">
                <h1>CHECKLIST VAN HI ACE</h1>
                <h2>Perkhidmatan Van Jenazah</h2>
            </div>
            <div class="meta-info">
                <div class="input-group">
                    <label>Perjalanan:</label>
                    <select id="trip-type">
                        <option value="PERGI">PERGI (Departure)</option>
                        <option value="BALIK">BALIK (Return)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nama Driver:</label>
                    <input type="text" id="driver-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Nama Ko Pilot:</label>
                    <input type="text" id="copilot-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Tarikh / Masa:</label>
                    <input type="datetime-local" id="datetime">
                </div>
            </div>
        </div>

        <!-- 3D Viewer Area -->
        <!-- ============================================================================================================== -->
        <!-- TO USE YOUR OWN HI-ACE: Upload a .glb file to your server and paste the link inside the src="" quotes below! -->
        <!-- ============================================================================================================== -->
        <model-viewer 
            id="van-3d-display"
            src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb" 
            alt="3D Model of Van HiAce" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1"
            exposure="1"
            camera-orbit="45deg 75deg 105%">
            
            <!-- Hotspots will be injected here by JS -->

        </model-viewer>

        <div style="text-align: center; font-weight: bold; margin-bottom: 10px; color: #555;">
            --- CEK BODY KELILING SEBELUM KELUAR DAN BALIK ---
        </div>

        <!-- Checklist Area -->
        <div class="checklist-container" id="checklist-container">
            <!-- Checklist items will be injected here by JS -->
        </div>

        <div style="margin-top: 30px; border: 2px solid var(--primary-color); border-radius: 8px; padding: 15px;">
            <h3 style="margin-top: 0; color: var(--primary-color);">GENERAL REMARK :</h3>
            <textarea style="width: 100%; min-height: 80px; border: none; resize: none; font-family: inherit;" placeholder="Tulis sebarang nota tambahan di sini..."></textarea>
        </div>

    </div>

    <script>
        // Data for the checklist. 
        // I have updated these X, Y, Z coordinates to fit the shape of the placeholder truck.
        // If you upload your own Hi-Ace .glb file, you might need to adjust these numbers slightly so they float on the exact right parts of the van.
        const checklistData = [
            { id: 1, label: "Cek body keliling sebelum keluar dan balik", position: "0 1.2 0" }, // Middle of body
            { id: 2, label: "Cek 4pcs Tayar (angin 220psi)", position: "-1 0.4 1.2" }, // Front driver-side tire
            { id: 3, label: "Cek Air Radiator", position: "0 0.8 2.2" }, // Front bumper/grille area
            { id: 4, label: "Minyak Engine", position: "0.4 1.2 1.8" }, // Hood area (right)
            { id: 5, label: "Minyak brake", position: "-0.4 1.2 1.8" }, // Hood area (left)
            { id: 6, label: "Minyak power steering", position: "0.2 1.2 1.9" }, // Hood area (center)
            { id: 7, label: "Angin tayar spare + toolset", position: "0 0.5 -2.2" }, // Rear undercarriage
            { id: 8, label: "Car wash (selepas selesai urusan)", position: "0 2.5 0" } // Roof
        ];

        const modelViewer = document.getElementById('van-3d-display');
        const checklistContainer = document.getElementById('checklist-container');

        // Initialize App
        function initApp() {
            checklistData.forEach(item => {
                // 1. Create 3D Hotspots on the model-viewer
                const hotspot = document.createElement('button');
                hotspot.className = 'indicator';
                hotspot.slot = `hotspot-${item.id}`;
                hotspot.id = `indicator-${item.id}`;
                hotspot.dataset.position = item.position;
                hotspot.dataset.normal = "0 1 0"; // Points straight up
                hotspot.innerText = item.id;
                
                // Clicking a 3D dot focuses the camera on it
                hotspot.addEventListener('click', () => {
                    modelViewer.cameraTarget = item.position;
                });

                modelViewer.appendChild(hotspot);

                // 2. Create Checklist Rows
                const row = document.createElement('div');
                row.className = 'checklist-item';
                
                row.innerHTML = `
                    <div class="item-number">${item.id}</div>
                    <div class="item-label">${item.label}</div>
                    <div class="item-actions">
                        <label class="radio-label" style="color: var(--success-color);">
                            <input type="radio" name="item_${item.id}" value="ok" onchange="handleSelection(${item.id}, 'ok')">
                            OK
                        </label>
                        <label class="radio-label" style="color: var(--danger-color);">
                            <input type="radio" name="item_${item.id}" value="not-ok" onchange="handleSelection(${item.id}, 'not-ok')">
                            Not OK
                        </label>
                        <input type="text" class="remark-input" id="remark-${item.id}" placeholder="Nyatakan isu / Remark...">
                    </div>
                `;
                checklistContainer.appendChild(row);
            });
        }

        // Handle Radio Button Selection
        function handleSelection(id, status) {
            const indicator = document.getElementById(`indicator-${id}`);
            const remarkInput = document.getElementById(`remark-${id}`);

            // Reset classes
            indicator.classList.remove('ok', 'not-ok');

            if (status === 'ok') {
                indicator.classList.add('ok');
                indicator.innerHTML = '✔';
                remarkInput.style.display = 'none';
                remarkInput.value = ''; 
            } else if (status === 'not-ok') {
                indicator.classList.add('not-ok');
                indicator.innerHTML = '✖';
                remarkInput.style.display = 'block';
                remarkInput.focus(); 
                
                // Optionally move the 3D camera to the issue when "Not OK" is clicked
                const targetPosition = checklistData.find(item => item.id === id).position;
                modelViewer.cameraTarget = targetPosition;
            }
        }

        // PDF Export Function using html2pdf.js
        function exportPDF() {
            const element = document.getElementById('document-container');
            const driverName = document.getElementById('driver-name').value || 'Unknown';
            const tripType = document.getElementById('trip-type').value;
            
            const fileName = `Checklist_Van_${tripType}_${driverName.replace(/\s+/g, '_')}.pdf`;

            // Configuration for PDF
            const opt = {
                margin:       0.5,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // Trigger download
            html2pdf().set(opt).from(element).save();
        }

        // Run initialization on load
        window.onload = initApp;
    </script>
</body>
</html>

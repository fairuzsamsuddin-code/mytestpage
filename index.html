<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Van Hi Ace - Pengurusan Jenazah</title>
    
    <!-- Include html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #0b1a30;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Main Container */
        #document-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease; /* Smooth transition when resizing for PDF */
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .title h1 {
            margin: 0;
            font-size: 32px;
            color: var(--primary-color);
            text-transform: uppercase;
        }
        
        .title h2 {
            margin: 0;
            font-size: 20px;
            color: #555;
        }

        .meta-info {
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            width: 320px;
            background-color: #fcfcfc;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .input-group label {
            width: 110px;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input, .input-group select {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 2D Van Display */
        .van-display-container {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background-color: white;
            padding: 20px 0;
        }

        .van-display-container img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Indicators on the Van */
        .indicator {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .indicator.ok {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .indicator.not-ok {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Checklist Table Styles */
        .checklist-container {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            background-color: white;
        }
        
        .checklist-item:last-child {
            border-bottom: none;
        }

        /* Extracting Icons using CSS Sprites from icon.jpeg */
        .item-icon {
            width: 45px;
            height: 45px;
            background-image: url('icon.jpeg');
            background-size: auto 800%; 
            background-repeat: no-repeat;
            margin-right: 15px;
            border-radius: 50%;
            border: 1px solid #eee;
        }

        .icon-1 { background-position: 2% 0%; }
        .icon-2 { background-position: 2% 14.28%; }
        .icon-3 { background-position: 2% 28.57%; }
        .icon-4 { background-position: 2% 42.85%; }
        .icon-5 { background-position: 2% 57.14%; }
        .icon-6 { background-position: 2% 71.42%; }
        .icon-7 { background-position: 2% 85.71%; }
        .icon-8 { background-position: 2% 100%; }

        .item-label {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
        }

        /* Action Buttons (✔ / ✖) */
        .item-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-radio {
            display: none;
        }

        .action-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 35px;
            border: 2px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            background: white;
            transition: all 0.2s;
        }

        .action-btn.ok-btn { color: var(--success-color); }
        .action-btn.nok-btn { color: var(--danger-color); }

        .action-radio[value="ok"]:checked + .action-btn.ok-btn {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .action-radio[value="not-ok"]:checked + .action-btn.nok-btn {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .remark-input {
            display: none;
            margin-left: 10px;
            padding: 8px;
            border: 1px solid var(--danger-color);
            border-radius: 4px;
            width: 200px;
            background-color: #fff8f8;
            font-family: inherit;
        }

        /* General Remark Box */
        .general-remark {
            margin-top: 30px; 
            border: 2px solid var(--primary-color); 
            border-radius: 8px; 
            padding: 15px;
            background-color: #f9f9f9;
        }

        .btn-print {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        .btn-print:hover {
            background-color: #1a365d;
        }

        /* ========================================================
           PDF EXPORT MODE STYLES
           These apply ONLY when exporting to guarantee 1-page fit
        ======================================================== */
        .pdf-mode {
            padding: 15px !important;
        }
        .pdf-mode .header {
            margin-bottom: 10px !important;
            padding-bottom: 10px !important;
        }
        .pdf-mode .title h1 {
            font-size: 24px !important;
        }
        .pdf-mode .title h2 {
            font-size: 16px !important;
        }
        .pdf-mode .meta-info {
            padding: 10px !important;
        }
        .pdf-mode .van-display-container {
            margin-bottom: 15px !important;
            padding: 5px 0 !important;
        }
        .pdf-mode .checklist-item {
            padding: 4px 15px !important;
        }
        .pdf-mode .item-icon {
            width: 35px !important;
            height: 35px !important;
            margin-right: 10px !important;
        }
        .pdf-mode .action-btn {
            height: 30px !important;
            width: 35px !important;
        }
        .pdf-mode .general-remark {
            margin-top: 15px !important;
            padding: 10px !important;
        }
        .pdf-mode .general-remark textarea {
            min-height: 50px !important;
        }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;" id="no-print-area">
        <button class="btn-print" onclick="exportPDF()">🖨️ Export Completed Checklist to PDF</button>
    </div>

    <!-- Export Container -->
    <div id="document-container">
        
        <div class="header">
            <div class="title">
                <h1>CHECKLIST VAN HI ACE</h1>
                <h2>Perkhidmatan Van Jenazah</h2>
            </div>
            <div class="meta-info">
                <div class="input-group">
                    <label>Perjalanan:</label>
                    <select id="trip-type">
                        <option value="PERGI">PERGI (Departure)</option>
                        <option value="BALIK">BALIK (Return)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nama Driver:</label>
                    <input type="text" id="driver-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Nama Ko Pilot:</label>
                    <input type="text" id="copilot-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Tarikh / Masa:</label>
                    <input type="datetime-local" id="datetime">
                </div>
            </div>
        </div>

        <div style="text-align: center; font-weight: bold; margin-bottom: 5px; color: #555;">
            --- PANDUAN LOKASI PEMERIKSAAN KENDERAAN ---
        </div>

        <!-- Interactive 2D Van Map Area using van.jpeg -->
        <div class="van-display-container" id="van-display">
            <img src="van.jpeg" alt="Van Views">
            <!-- Indicators injected by JS will absolute position over this image -->
        </div>

        <!-- Checklist Area -->
        <div class="checklist-container" id="checklist-container">
            <!-- Checklist items will be injected here by JS -->
        </div>

        <!-- General Remarks -->
        <div class="general-remark">
            <h3 style="margin-top: 0; margin-bottom: 10px; color: var(--primary-color);">GENERAL REMARK :</h3>
            <textarea style="width: 100%; min-height: 80px; border: 1px solid #ccc; border-radius: 4px; padding: 10px; resize: none; font-family: inherit; box-sizing: border-box;" placeholder="Tulis sebarang nota tambahan atau kerosakan di sini..."></textarea>
        </div>

    </div>

    <script>
        // Data for the checklist mapping
        const checklistData = [
            { id: 1, label: "Cek body keliling sebelum keluar Dan balik", top: "50%", left: "85%" },
            { id: 2, label: "Cek 4pcs Tayar (angin 220psi)", top: "75%", left: "35%" }, 
            { id: 3, label: "Cek Air Radiator", top: "65%", left: "9%" },
            { id: 4, label: "Minyak Engine", top: "55%", left: "5%" }, 
            { id: 5, label: "Minyak brake", top: "55%", left: "13%" }, 
            { id: 6, label: "Minyak power steering", top: "55%", left: "9%" }, 
            { id: 7, label: "Angin tayar spare + toolset", top: "85%", left: "61%" },
            { id: 8, label: "Car wash (selepas selesai urusan)", top: "35%", left: "35%" } 
        ];

        const vanDisplay = document.getElementById('van-display');
        const checklistContainer = document.getElementById('checklist-container');

        // Initialize App
        function initApp() {
            checklistData.forEach(item => {
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.id = `indicator-${item.id}`;
                indicator.style.top = item.top;
                indicator.style.left = item.left;
                indicator.innerText = item.id;
                vanDisplay.appendChild(indicator);

                const row = document.createElement('div');
                row.className = 'checklist-item';
                
                row.innerHTML = `
                    <div class="item-icon icon-${item.id}"></div>
                    <div class="item-label">${item.label}</div>
                    <div class="item-actions">
                        <label>
                            <input type="radio" name="item_${item.id}" value="ok" class="action-radio" onchange="handleSelection(${item.id}, 'ok')">
                            <span class="action-btn ok-btn">✔</span>
                        </label>
                        <label>
                            <input type="radio" name="item_${item.id}" value="not-ok" class="action-radio" onchange="handleSelection(${item.id}, 'not-ok')">
                            <span class="action-btn nok-btn">✖</span>
                        </label>
                        <input type="text" class="remark-input" id="remark-${item.id}" placeholder="Nyatakan isu / Remark...">
                    </div>
                `;
                checklistContainer.appendChild(row);
            });
        }

        // Handle Radio Button Selection
        function handleSelection(id, status) {
            const indicator = document.getElementById(`indicator-${id}`);
            const remarkInput = document.getElementById(`remark-${id}`);

            indicator.classList.remove('ok', 'not-ok');

            if (status === 'ok') {
                indicator.classList.add('ok');
                indicator.innerHTML = '✔';
                remarkInput.style.display = 'none';
                remarkInput.value = ''; 
            } else if (status === 'not-ok') {
                indicator.classList.add('not-ok');
                indicator.innerHTML = '✖';
                remarkInput.style.display = 'block';
                remarkInput.focus(); 
            }
        }

        // PDF Export Function
        function exportPDF() {
            const element = document.getElementById('document-container');
            const driverName = document.getElementById('driver-name').value || 'Unknown';
            const tripType = document.getElementById('trip-type').value;
            const fileName = `Checklist_Van_${tripType}_${driverName.replace(/\s+/g, '_')}.pdf`;

            // 1. Add the special class to compress the layout for exactly one page
            element.classList.add('pdf-mode');

            const opt = {
                margin:       0.3,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // 2. Generate PDF and wait for it to finish
            html2pdf().set(opt).from(element).save().then(() => {
                // 3. Remove the class so the website returns to its normal viewing size
                element.classList.remove('pdf-mode');
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>

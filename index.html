<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Van - MGKL Prihatin</title>
    
    <!-- Include html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            /* Corporate Theme Colors: Black and Gold */
            --primary-color: #000000; /* Black */
            --gold-color: #D4AF37; /* Corporate Gold */
            --success-color: #28a745; /* Kept standard for UI clarity */
            --danger-color: #dc3545;  /* Kept standard for UI clarity */
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Main Container */
        #document-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid var(--gold-color);
        }

        /* Header Styles - Flex layout to accommodate the logo */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1 1 350px;
        }

        /* Logo Styling */
        .org-logo {
            max-height: 80px;
            max-width: 150px;
            object-fit: contain;
        }

        /* Breathing space for title */
        .title {
            padding-right: 40px;
        }

        .title h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            color: var(--primary-color);
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }
        
        .title h2 {
            margin: 0;
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }

        .meta-info {
            flex: 1 1 250px;
            border: 2px solid var(--gold-color);
            padding: 15px;
            border-radius: 8px;
            background-color: #fffdf5;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .input-group label {
            width: 100px;
            font-weight: bold;
            font-size: 13px;
            color: var(--primary-color);
        }

        .input-group input, .input-group select {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Interactive Van Display - Locked Aspect Ratio */
        .van-display {
            position: relative;
            width: 100%;
            aspect-ratio: 1.45; /* Matches the 4-view image dimensions perfectly */
            background-color: #ffffff;
            border-radius: 8px;
            margin-bottom: 15px;
            background-image: url('van_view.jpeg');
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid var(--gold-color);
        }

        /* Indicators on the Van */
        .indicator {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 8px;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .indicator.ok {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .indicator.not-ok {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Checklist Table Styles */
        .checklist-container {
            width: 100%;
            border-collapse: collapse;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start; /* Keeps the number aligned with the top of the text */
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .item-number {
            background-color: var(--primary-color);
            color: var(--gold-color);
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            flex-shrink: 0;
            border: 1px solid var(--gold-color);
            margin-top: 2px; /* Slight visual adjustment to match text baseline */
        }

        .item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Spacing between label and buttons */
        }

        .item-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--primary-color);
            line-height: 1.4;
        }

        .item-bottom-row {
            display: flex;
            justify-content: flex-end; /* Aligns the actions to the right */
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        /* Custom Check/Cross Buttons */
        .radio-btn {
            cursor: pointer;
            display: inline-block;
        }

        .radio-btn input {
            display: none; 
        }

        .radio-btn span {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-size: 18px;
            background-color: white;
            transition: all 0.2s;
        }

        .radio-btn input[value="ok"]:checked + span {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
        }

        .radio-btn input[value="not-ok"]:checked + span {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            color: white;
        }

        .radio-btn span:hover {
            background-color: #f0f0f0;
        }

        .remark-input {
            display: none;
            flex: 1; /* Allows the remark input to stretch and take up available space on the left */
            padding: 8px;
            border: 1px solid var(--danger-color);
            border-radius: 4px;
            background-color: #fff8f8;
            font-size: 13px;
        }

        /* Controls */
        .btn {
            background-color: var(--gold-color);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-color);
            color: var(--gold-color);
            border-color: var(--gold-color);
        }

        /* Hide elements when exporting to PDF */
        .html2pdf__container {
            padding: 0 !important;
        }
    </style>
</head>
<body>

    <!-- Export Container -->
    <div id="document-container">
        
        <div class="header">
            <div class="brand-section">
                <!-- Logo -->
                <img src="mgklprihatin.jpeg" alt="MGKL Prihatin Logo" class="org-logo" onerror="this.src='https://placehold.co/150x80/000000/D4AF37?text=MGKL+PRIHATIN'">
                
                <div class="title">
                    <h2>Checklist</h2>
                    <h2>Van Jenazah</h2>
                </div>
            </div>
            
            <div class="meta-info">
                <div class="input-group">
                    <label>Perjalanan:</label>
                    <select id="trip-type">
                        <option value="Pergi">Pergi (Departure)</option>
                        <option value="Balik">Balik (Return)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nama Driver:</label>
                    <input type="text" id="driver-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Nama Co-Pilot:</label>
                    <input type="text" id="copilot-name" placeholder="Isi nama...">
                </div>
                <div class="input-group">
                    <label>Tarikh / Masa:</label>
                    <input type="datetime-local" id="datetime">
                </div>
            </div>
        </div>

        <!-- Interactive Van Area -->
        <div class="van-display" id="van-display">
            <!-- Indicators will be injected here by JS -->
        </div>

        <div style="text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--primary-color); padding-top: 5px;">
            CHECK KELILING VAN SEBELUM KELUAR DAN PULANG BERTUGAS
        </div>

        <!-- Checklist Area -->
        <div class="checklist-container" id="checklist-container">
            <!-- Checklist items will be injected here by JS -->
        </div>

        <div style="margin-top: 20px; border: 2px solid var(--gold-color); border-radius: 8px; padding: 15px; background-color: #fffdf5;">
            <h3 style="margin-top: 0; margin-bottom: 10px; color: var(--primary-color); font-size: 16px;">Nota tambahan:</h3>
            <textarea style="width: 100%; min-height: 50px; border: none; background: transparent; resize: none; font-family: inherit; font-size: 14px;" placeholder="Tulis sebarang nota tambahan di sini..."></textarea>
        </div>

    </div>

    <!-- Export Button Moved to the Bottom -->
    <div style="text-align: center; margin-top: 30px; margin-bottom: 40px;" id="no-print-area">
        <button class="btn" onclick="exportPDF()">🖨️ Eksport ke PDF</button>
    </div>

    <script>
        // Data mapped and recalibrated for van_view.jpeg
        const checklistData = [
            { id: 1, label: "Check keliling van sebelum keluar dan pulang bertugas", top: "75%", left: "75%" },
            { id: 2, label: "Check angin kesemua tayar (220psi)", top: "89%", left: "57%" }, 
            { id: 3, label: "Check air radiator", top: "42%", left: "18%" },
            { id: 4, label: "Minyak engine", top: "34%", left: "10%" },
            { id: 5, label: "Minyak brake", top: "34%", left: "26%" },
            { id: 6, label: "Minyak power steering", top: "26%", left: "18%" },
            { id: 7, label: "Angin tayar spare + toolset", top: "90%", left: "25%" },
            { id: 8, label: "Car wash (selepas selesai urusan)", top: "8%", left: "75%" }
        ];

        const vanDisplay = document.getElementById('van-display');
        const checklistContainer = document.getElementById('checklist-container');

        // Initialize App
        function initApp() {
            checklistData.forEach(item => {
                // 1. Create Indicators on the Van
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.id = `indicator-${item.id}`;
                indicator.style.top = item.top;
                indicator.style.left = item.left;
                indicator.innerText = item.id; 
                vanDisplay.appendChild(indicator);

                // 2. Create Checklist Rows with Reordered Layout
                const row = document.createElement('div');
                row.className = 'checklist-item';
                
                row.innerHTML = `
                    <div class="item-number">${item.id}</div>
                    <div class="item-content">
                        <div class="item-label">${item.label}</div>
                        <div class="item-bottom-row">
                            <input type="text" class="remark-input" id="remark-${item.id}" placeholder="Nyatakan isu / Remark...">
                            <div class="item-actions">
                                <label class="radio-btn">
                                    <input type="radio" name="item_${item.id}" value="ok" onchange="handleSelection(${item.id}, 'ok')">
                                    <span style="color: #ccc;">✔</span>
                                </label>
                                <label class="radio-btn">
                                    <input type="radio" name="item_${item.id}" value="not-ok" onchange="handleSelection(${item.id}, 'not-ok')">
                                    <span style="color: #ccc;">✖</span>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
                checklistContainer.appendChild(row);
            });
        }

        // Handle Radio Button Selection
        function handleSelection(id, status) {
            const indicator = document.getElementById(`indicator-${id}`);
            const remarkInput = document.getElementById(`remark-${id}`);

            // Reset classes
            indicator.classList.remove('ok', 'not-ok');

            if (status === 'ok') {
                indicator.classList.add('ok');
                indicator.innerHTML = '✔';
                remarkInput.style.display = 'none';
                remarkInput.value = ''; // Clear remark if changed back to OK
            } else if (status === 'not-ok') {
                indicator.classList.add('not-ok');
                indicator.innerHTML = '✖';
                remarkInput.style.display = 'block';
                remarkInput.focus(); // Prompt driver to type issue
            }
        }

        // PDF Export Function using html2pdf.js
        function exportPDF() {
            const element = document.getElementById('document-container');
            const driverName = document.getElementById('driver-name').value || 'Unknown';
            const tripType = document.getElementById('trip-type').value;
            
            // Generate filename based on driver and trip type
            const fileName = `Checklist_Van_${tripType}_${driverName.replace(/\s+/g, '_')}.pdf`;

            // Calculate actual height of the element using scrollHeight to prevent cut off
            const pdfWidth = element.scrollWidth;
            const pdfHeight = element.scrollHeight + 60; // adding 60px padding for safety margin

            const opt = {
                margin:       0,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    scrollY: 0,
                    windowY: 0,
                    height: pdfHeight // Forces html2canvas to capture the entire height
                },
                jsPDF:        { unit: 'px', format: [pdfWidth, pdfHeight], orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // Run initialization
        initApp();
    </script>
</body>
</html>
